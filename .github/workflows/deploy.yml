name: Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_TXG4dv4PhwKU0ZleJJfK8i8y
  VERCEL_PROJECT_ID: prj_8CkVnN10UydRkgRilhCz6CGUmPeR
  VERCEL_SCOPE: watchers0930s-projects
  PRODUCTION_ALIAS: m-master.vercel.app

jobs:
  production:
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync environment variables to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # 비밀값은 env 로만 넘긴다 — run: 스크립트에 secrets 표현식을 직접 넣으면 따옴표·$ 가 섞일 때 셸이 깨지거나 해석한다
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # UNSPLASH_ACCESS_KEY — GitHub Secret → Vercel env var
          # 기존 값 삭제 후 재등록 (이미 존재할 수 있으므로 에러 무시)
          npx vercel env rm UNSPLASH_ACCESS_KEY production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --yes 2>/dev/null || true
          # printf '%s' — echo 는 끝에 개행을 붙여 env 값을 오염시킨다(lib/ci/__tests__/workflow-env.test.cjs)
          printf '%s' "$UNSPLASH_ACCESS_KEY" | npx vercel env add UNSPLASH_ACCESS_KEY production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Deploy production to Vercel
        id: deploy_production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          DEPLOYMENT_URL=$(
            npx vercel deploy \
              --prod \
              --token="$VERCEL_TOKEN" \
              --scope="$VERCEL_SCOPE" \
              --yes 2>&1 | tee /tmp/vercel-production.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n 1
          )

          if [ -z "$DEPLOYMENT_URL" ]; then
            cat /tmp/vercel-production.log
            exit 1
          fi

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Assign production alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          npx vercel alias set \
            "${{ steps.deploy_production.outputs.deployment_url }}" \
            "$PRODUCTION_ALIAS" \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_SCOPE"
