name: Deploy

on:
  push:
    branches:
      - test
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_TXG4dv4PhwKU0ZleJJfK8i8y
  VERCEL_PROJECT_ID: prj_8CkVnN10UydRkgRilhCz6CGUmPeR
  VERCEL_SCOPE: watchers0930s-projects
  PRODUCTION_ALIAS: m-master.vercel.app

jobs:
  preview:
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy preview to Vercel
        id: deploy_preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          DEPLOYMENT_URL=$(
            npx vercel deploy \
              --token="$VERCEL_TOKEN" \
              --scope="$VERCEL_SCOPE" \
              --yes 2>&1 | tee /tmp/vercel-preview.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n 1
          )

          if [ -z "$DEPLOYMENT_URL" ]; then
            cat /tmp/vercel-preview.log
            exit 1
          fi

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

  production:
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy production to Vercel
        id: deploy_production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          DEPLOYMENT_URL=$(
            npx vercel deploy \
              --prod \
              --token="$VERCEL_TOKEN" \
              --scope="$VERCEL_SCOPE" \
              --yes 2>&1 | tee /tmp/vercel-production.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n 1
          )

          if [ -z "$DEPLOYMENT_URL" ]; then
            cat /tmp/vercel-production.log
            exit 1
          fi

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Assign production alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          npx vercel alias set \
            "${{ steps.deploy_production.outputs.deployment_url }}" \
            "$PRODUCTION_ALIAS" \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_SCOPE"
